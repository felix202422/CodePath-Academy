<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="CodePath-Academy">
  <!-- Original CodePath-Academy mark: a "</>" glyph on the brand gradient.
       Kept as pure geometry (no text/fonts) so every renderer draws it
       identically; scripts/generate_brand_assets.py draws the same shapes for
       the PNG icon set. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#28245f" />
      <stop offset="1" stop-color="#4f46e5" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)" />
  <g fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 20 L14 32 L24 44" />
    <path d="M37 17 L27 47" />
    <path d="M40 20 L50 32 L40 44" />
  </g>
</svg>
