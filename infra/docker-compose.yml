# Local development / verification stack.
# Usage: docker compose -f infra/docker-compose.yml up --build
# Production deployments use a managed PostgreSQL; see docs/DEPLOYMENT.md (Phase 11).
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codepath_academy}
      POSTGRES_USER: ${POSTGRES_USER:-codepath_academy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: ../infra/docker/Dockerfile.backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-codepath_academy}
      DB_USERNAME: ${POSTGRES_USER:-codepath_academy}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      APP_BOOTSTRAP_ADMIN_ENABLED: ${APP_BOOTSTRAP_ADMIN_ENABLED:-false}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      APP_BOOTSTRAP_ADMIN_PASSWORD: ${APP_BOOTSTRAP_ADMIN_PASSWORD:-}
      APP_MEDIA_ROOT: /app/data/media
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/app/data/media
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/docker/Dockerfile.frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  media:
