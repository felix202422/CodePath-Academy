# Same-origin reverse proxy: serves the SPA and forwards /api + /actuator to the backend.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (mirrors the backend's chain for defense in depth).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # API and actuator go to the Spring Boot service.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # Actuator stays internal: never expose it from the public edge.
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
    }

    # SPA fallback: React Router owns client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
