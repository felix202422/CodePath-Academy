# Same-origin reverse proxy: serves the SPA and forwards /api + /actuator to the backend.
#
# Caching policy (docs/DEPLOYMENT.md → HTTP caching):
#   - Vite content-hashed assets  -> long-lived immutable cache
#   - HTML (index.html fallback)  -> revalidate every time (deploys take effect at once)
#   - images                      -> long-lived public cache
#   - API                         -> never cached (backend sends no-store)
# NOTE: nginx does not inherit add_header into a location that declares its own,
# so security headers are repeated wherever Cache-Control is set.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (mirrors the backend's chain for defense in depth).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # API and actuator go to the Spring Boot service. Responses are no-store
    # at the application; nothing here adds caching headers to /api.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        # Actuator stays internal: never expose it from the public edge.
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
    }

    # Content-hashed build output (dist/assets/*): safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Images and icons: stable names, long-lived but revalidatable.
    location ~* \.(?:png|jpg|jpeg|webp|avif|gif|ico|svg)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Crawler files: always revalidated so robots/sitemap updates propagate.
    location = /robots.txt {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /sitemap.xml {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback: React Router owns client-side routes. HTML must revalidate
    # so a new deploy is picked up without hard refreshes.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
